services:

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

  rag-api:
    build: .

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - qdrant

    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      COLLECTION_NAME: python_docs

      OLLAMA_MODEL: gemma3:4b
      OLLAMA_BASE_URL: http://host.docker.internal:11434

volumes:
  qdrant_data: